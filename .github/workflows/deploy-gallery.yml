name: BILIGIO gallery — SFTP 3822

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.pages.yml'
      - 'content/gallery/**'
      - 'media/gallery/**'
      - 'assets/gallery.*'
      - '*.py'
      - 'homepage_patch.json'
      - 'requirements-deploy.txt'
      - '.github/workflows/deploy-gallery.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check: 접속 검사 / install: 갤러리+홈 메뉴 설치 / deploy: 갤러리만 갱신'
        required: true
        default: check
        type: choice
        options: [check, install, deploy]

permissions:
  contents: read

concurrency:
  group: biligio-gallery-deploy
  cancel-in-progress: false

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate gallery and homepage changes
        run: python -m unittest discover -s tests -v
      - name: Build gallery
        run: python build_gallery.py
      - name: Keep generated gallery for review
        uses: actions/upload-artifact@v4
        with:
          name: biligio-gallery-preview
          path: dist/gallery/
          retention-days: 7
      - name: Install SFTP dependency
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.GALLERY_AUTO_DEPLOY == 'true') }}
        run: python -m pip install -r requirements-deploy.txt
      - name: Check or publish via SFTP 3822
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.GALLERY_AUTO_DEPLOY == 'true') }}
        env:
          # Reuse the existing three Secrets; their names do not set the protocol.
          CAFE24_SFTP_HOST: ${{ secrets.CAFE24_FTP_HOST }}
          CAFE24_SFTP_USER: ${{ secrets.CAFE24_FTP_USER }}
          CAFE24_SFTP_PASSWORD: ${{ secrets.CAFE24_FTP_PASSWORD }}
          CAFE24_SFTP_HOSTKEY_SHA256: ${{ secrets.CAFE24_SFTP_HOSTKEY_SHA256 }}
          REQUESTED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deploy' }}
        run: python sftp_deploy.py --mode "$REQUESTED_MODE"
